<!--
  TrickFunda Video Sniffer - Extension Icon
  Sizes needed: 16x16, 32x32, 48x48, 128x128
  
  To generate PNG icons from this SVG:
  1. Open this file in a browser
  2. Right-click → Save As PNG at each size
  OR use an online SVG-to-PNG converter
  
  For quick testing, Chrome also accepts SVG files in manifest.json
  (just rename this to icon-16.png etc. or update manifest to use .svg)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0033"/>
      <stop offset="100%" style="stop-color:#030014"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  
  <!-- Concentric circles -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Crosshairs -->
  <line x1="24" y1="64" x2="104" y2="64" stroke="#6366f1" stroke-width="0.8" opacity="0.15"/>
  <line x1="64" y1="24" x2="64" y2="104" stroke="#6366f1" stroke-width="0.8" opacity="0.15"/>
  
  <!-- Sweep line -->
  <line x1="64" y1="64" x2="64" y2="24" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Sweep glow area -->
  <path d="M64,64 L64,24 A40,40 0 0,1 92,36 Z" fill="url(#sweep)" opacity="0.3"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="64" r="5" fill="#6366f1">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="64" r="3" fill="#818cf8"/>
  
  <!-- Detection blips -->
  <circle cx="80" cy="42" r="3.5" fill="#10b981" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="50" r="2.5" fill="#06b6d4" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="2" fill="#818cf8" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
